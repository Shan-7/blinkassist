name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    - name: Build with PyInstaller (Folder Distribution)
      run: |
        python -m PyInstaller blink_assist.spec --clean --noconfirm

    - name: Build with PyInstaller (Single Standalone EXE)
      run: |
        python -m PyInstaller blink_assist_singlefile.spec --noconfirm

    - name: Create Distribution ZIP
      run: |
        powershell Compress-Archive -Path dist\BlinkAssist\* -DestinationPath BlinkAssist_Windows.zip -Force

    - name: Upload Windows Folder ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlinkAssist_Windows_Zip
        path: BlinkAssist_Windows.zip
        retention-days: 14

    - name: Upload Standalone EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlinkAssist_Standalone_EXE
        path: dist/BlinkAssist-Standalone.exe
        retention-days: 14
